<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width:200px ;
            background-color:blue ;
            position: relative;
            animation-name: movebox;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: ease;
        }
        .a{
            height: 200px;
            width:200px ;
            background-color:blue ;
            position: relative;
            animation-name: movebox;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in;
        }
        .b{
            height: 200px;
            width:200px ;
            background-color:blue ;
            position: relative;
            animation-name: movebox;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-out;
        }
        .c{
            height: 200px;
            width:200px ;
            background-color:blue ;
            position: relative;
            animation-name: movebox;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }
        @keyframes movebox{
            from{
                left: 0px;
                background-color: red;
            }
            to{
                left:500px
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
</body>
</html>
